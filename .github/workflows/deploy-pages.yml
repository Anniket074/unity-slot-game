name: Deploy WebGL build to GitHub Pages

# Publishes the committed Build/WebGL folder as a static site, so the game can be
# played from a single URL without cloning the repository or running a local server.

on:
  push:
    branches: [main]
    paths:
      - 'Build/WebGL/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL build
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/WebGL

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
